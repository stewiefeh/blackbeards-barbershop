<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470">
  <g id="logo">
    <!-- tricorn hat -->
    <path d="M 24,100
             C 8,88 14,64 42,56
             C 84,26 144,12 216,15
             C 298,13 358,34 394,60
             C 422,74 428,98 408,112
             C 388,124 360,118 342,138
             C 320,158 286,148 222,150
             C 158,148 124,158 100,136
             C 82,118 46,124 24,100 Z"
          fill="#1a161e" stroke="#f2ecdd" stroke-width="9" stroke-linejoin="round"/>

    <!-- hat emblem: small skull -->
    <g id="logo">
      <path d="M 198,54 C 198,40 210,32 220,32 C 230,32 242,40 242,54
               C 242,64 237,70 231,73 L 231,79 L 226,76 L 220,77 L 214,76 L 209,79 L 209,73
               C 203,70 198,64 198,54 Z" fill="#f2ecdd"/>
      <ellipse cx="213" cy="53" rx="4.5" ry="5.5" fill="#1a161e"/>
      <ellipse cx="227" cy="53" rx="4.5" ry="5.5" fill="#1a161e"/>
      <path d="M 220,61 L 220,68" stroke="#1a161e" stroke-width="3"/>
      <!-- crossed scissors, rings at the bottom -->
      <g stroke="#f2ecdd" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M 200,86 L 240,112"/>
        <path d="M 240,86 L 200,112"/>
      </g>
      <circle cx="197" cy="116" r="5.5" fill="none" stroke="#f2ecdd" stroke-width="4"/>
      <circle cx="243" cy="116" r="5.5" fill="none" stroke="#f2ecdd" stroke-width="4"/>
    </g>

    <!-- skull head -->
    <path d="M 104,198
             C 112,168 166,156 220,158
             C 274,156 328,168 336,198
             C 344,226 334,254 326,274
             C 340,288 342,308 330,322
             C 322,332 310,334 302,330
             C 306,348 300,366 288,380
             C 268,402 240,414 220,416
             C 200,414 172,402 152,380
             C 140,366 134,348 138,330
             C 130,334 118,332 110,322
             C 98,308 100,288 114,274
             C 106,254 96,226 104,198 Z"
          fill="#1a161e" stroke="#f2ecdd" stroke-width="8" stroke-linejoin="round"/>

    <!-- bandana across forehead -->
    <path d="M 116,206
             C 150,188 290,188 324,206
             C 330,216 328,228 320,236
             C 252,212 188,212 120,236
             C 112,228 110,216 116,206 Z"
          fill="#f2ecdd"/>

    <!-- patch strap over the bandana -->
    <path d="M 244,246 C 214,222 186,210 128,208" fill="none" stroke="#1a161e" stroke-width="10" stroke-linecap="round"/>

    <!-- left eye socket -->
    <ellipse cx="160" cy="260" rx="31" ry="27" fill="#1a161e" stroke="#f2ecdd" stroke-width="6"/>
    <!-- eye patch, viewer right -->
    <path d="M 238,232 C 270,224 300,236 306,258 C 312,278 298,296 274,298 C 250,300 236,286 236,264 C 236,252 237,240 238,232 Z"
          fill="#1a161e" stroke="#f2ecdd" stroke-width="6"/>

    <!-- nose -->
    <path d="M 212,282 L 198,306 C 207,313 224,313 231,306 Z" fill="#1a161e" stroke="#f2ecdd" stroke-width="5" stroke-linejoin="round"/>

    <!-- teeth -->
    <g id="logo">
      <rect x="190" y="314" width="58" height="26" rx="6" fill="#f2ecdd"/>
      <path d="M 205,314 L 205,340 M 219,314 L 219,340 M 233,314 L 233,340" stroke="#1a161e" stroke-width="4"/>
      <path d="M 190,327 L 248,327" stroke="#1a161e" stroke-width="3"/>
    </g>

    <!-- handlebar mustache -->
    <path d="M 220,332
             C 200,318 178,316 158,326
             C 138,336 122,334 116,320
             C 112,308 122,300 132,304
             C 128,314 138,318 148,312
             C 166,300 200,306 220,320
             C 240,306 274,300 292,312
             C 302,318 312,314 308,304
             C 318,300 328,308 324,320
             C 318,334 302,336 282,326
             C 262,316 240,318 220,332 Z"
          fill="#1a161e" stroke="#f2ecdd" stroke-width="6" stroke-linejoin="round"/>

    <!-- full beard with jagged bottom -->
    <path d="M 136,314
             C 148,364 162,402 184,422
             L 196,406 L 208,430 L 220,410 L 232,432 L 244,408 L 256,422
             C 278,400 292,362 304,314
             C 286,328 270,334 252,338
             C 240,342 228,344 220,344
             C 212,344 200,342 188,338
             C 170,334 154,328 136,314 Z"
          fill="#1a161e" stroke="#f2ecdd" stroke-width="7" stroke-linejoin="round"/>
  </g>
</svg>
